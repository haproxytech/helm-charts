{{- if and .Values.controller.tlsTicketKeys.enabled (not .Values.controller.tlsTicketKeys.secret) }}
{{- $secretName := include "kubernetes-ingress.tlsTicketKeys.fullname" . -}}
{{- $secretNs := include "kubernetes-ingress.namespace" . -}}
{{- $existing := lookup "v1" "Secret" $secretNs $secretName -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $secretName }}
  namespace: {{ $secretNs }}
  labels:
    {{- include "kubernetes-ingress.labels" . | nindent 4 }}
  {{- /* Same ordering as the default certificate Secret. */}}
  {{- if not .Values.namespace.create }}
  annotations:
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
  {{- end }}
data:
{{- if and $existing (index $existing.data "tls-ticket-keys") }}
  {{- /* Keep the keys across upgrades: new ones would break every issued ticket. */}}
  tls-ticket-keys: {{ index $existing.data "tls-ticket-keys" }}
{{- else }}
  {{- /* 3 keys of 80 bytes (AES-256 tickets), one per line. */}}
  tls-ticket-keys: {{ printf "%s\n%s\n%s\n" (randBytes 80) (randBytes 80) (randBytes 80) | b64enc }}
{{- end }}
{{- end }}
