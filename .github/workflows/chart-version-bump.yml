name: chart-version-bump

# haproxyci opens appVersion PRs that never touch the chart "version:" field
# (see #399, #401). Once CI is green on such a PR, merge it and push the
# matching "RELEASE: Tag release" commit that a maintainer used to add by hand.

on:
  workflow_run:
    workflows: ["lint-test-release"]
    types:
      - completed

permissions:
  contents: read

# Keyed per pull request rather than one group for the whole workflow: GitHub
# keeps only one *pending* run per group, so a shared group would let a third
# PR finishing CI silently evict a queued second one. Runs therefore overlap,
# and the script rebases and retries its push instead of relying on queueing.
concurrency:
  group: chart-version-bump-${{ github.event.workflow_run.head_sha }}

jobs:
  bump:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: large_runner
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Deliberately main, never the pull request head: this job holds a
      # write token and must not run anything out of a contributor's fork.
      # Full history so the script can rebase onto origin/main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install tools (helm, cr)
        run: bash .github/scripts/install_tools.sh

      - name: Merge appVersion PR and tag the chart release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BOT: haproxyci
          CHARTS: kubernetes-ingress|haproxy-unified-gateway
        run: bash .github/scripts/bump_chart_version.sh
