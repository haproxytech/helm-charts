name: haproxy-appversion

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: large_runner
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (helm, cr)
        run: bash .github/scripts/install_tools.sh

      - name: Bump appVersion to latest haproxy-alpine release
        env:
          CHART: haproxy/Chart.yaml
          IMAGE: haproxytech/haproxy-alpine
        run: |
          set -euo pipefail

          cur=$(awk '/^appVersion:/ {print $2; exit}' "$CHART")
          ver=$(awk '/^version:/ {print $2; exit}' "$CHART")

          # Only plain X.Y.Z release tags: skips -dev, -rc, s6-* and friends.
          latest=$(curl -fsSL "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100&ordering=last_updated" \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)

          # Both are fed to arithmetic expansion below, which evaluates its
          # operand as a bash expression -- never trust them unvalidated.
          for v in "$cur" "$ver"; do
            [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "malformed version in $CHART: $v"; exit 1; }
          done

          echo "current appVersion: $cur, latest release tag: $latest"
          if [ -z "$latest" ] || [ "$latest" = "$cur" ] || \
             [ "$(printf '%s\n%s\n' "$cur" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "nothing to do"
            exit 0
          fi

          IFS=. read -r cmaj cmin _ <<<"$cur"
          IFS=. read -r lmaj lmin _ <<<"$latest"
          IFS=. read -r vmaj vmin vpat <<<"$ver"
          if   [ "$lmaj" != "$cmaj" ]; then new="$((vmaj + 1)).0.0"
          elif [ "$lmin" != "$cmin" ]; then new="${vmaj}.$((vmin + 1)).0"
          else                              new="${vmaj}.${vmin}.$((vpat + 1))"
          fi
          echo "chart version: $ver -> $new"

          sed -i \
            -e "s|^version: .*|version: $new|" \
            -e "s|^appVersion: .*|appVersion: $latest|" \
            -e "s|\(${IMAGE}\):.*|\1:$latest|" \
            "$CHART"

          # Replace the artifacthub changes list with this single change.
          awk -v v="$latest" '
            /^  artifacthub.io\/changes: \|$/ { print; print "    - Update base image to HAProxy " v; drop = 1; next }
            drop && /^    - / { next }
            { drop = 0; print }
          ' "$CHART" > "$CHART.new" && mv "$CHART.new" "$CHART"

          # Nothing else validates this push: GITHUB_TOKEN commits do not
          # trigger the ci.yml workflow, so lint the chart here instead.
          helm lint haproxy/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -am "MINOR: haproxy: update appVersion to $latest"
          git push origin HEAD:main
