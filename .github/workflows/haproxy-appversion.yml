name: haproxy-appversion

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haproxy-appversion

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: large_runner
    permissions:
      contents: write
      actions: write
    steps:
      # Full history: the script rebases onto origin/main when a push races
      # with another workflow, which needs a merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools (helm, cr)
        run: bash .github/scripts/install_tools.sh

      - name: Bump appVersion to latest haproxy-alpine release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART: haproxy/Chart.yaml
          IMAGE: haproxytech/haproxy-alpine
        run: bash .github/scripts/bump_haproxy_appversion.sh
