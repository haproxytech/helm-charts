{{- if .Values.hugconf.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
  namespace: {{ include "haproxy-unified-gateway.namespace" . }}
  labels:
    {{- include "haproxy-unified-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
  namespace: {{ include "haproxy-unified-gateway.namespace" . }}
  labels:
    {{- include "haproxy-unified-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - "gate.v3.haproxy.org"
    resources:
      - hugconfs
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
  namespace: {{ include "haproxy-unified-gateway.namespace" . }}
  labels:
    {{- include "haproxy-unified-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
    namespace: {{ include "haproxy-unified-gateway.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
  namespace: {{ include "haproxy-unified-gateway.namespace" . }}
  labels:
    {{- include "haproxy-unified-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "haproxy-unified-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "haproxy-unified-gateway.hugconfCleanup.fullname" . }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hugconf-cleanup
          image: {{ include "haproxy-unified-gateway.image" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              # curl, not wget: the image's wget is BusyBox, which cannot send
              # DELETE, and the old "|| true" hid that, so nothing was deleted.
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              URL="https://kubernetes.default.svc/apis/gate.v3.haproxy.org/v3/namespaces/{{ include "haproxy-unified-gateway.namespace" . }}/hugconfs/{{ .Values.hugconf.name }}"
              code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X DELETE \
                --cacert "$SA/ca.crt" -H "Authorization: Bearer $(cat "$SA/token")" "$URL") || code=000
              case "$code" in
                200|202) echo "deleted HugConf {{ .Values.hugconf.name }}" ;;
                404) echo "HugConf {{ .Values.hugconf.name }} already gone" ;;
                *) echo "deleting HugConf {{ .Values.hugconf.name }} failed: HTTP $code"; cat /tmp/resp 2>/dev/null; exit 1 ;;
              esac
  backoffLimit: 1
{{- end }}
